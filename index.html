<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RizzPDF - Free Image to PDF Converter</title>

    <meta name="description"
        content="Convert JPG and PNG images into PDF files online for free with RizzPDF. Fast, secure and easy to use.">

    <link rel="stylesheet" href="style.css">

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940255385174353"
        crossorigin="anonymous">
    </script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container">

        <h1>📄 RizzPDF</h1>

        <p class="subtitle">
            Convert Images into High Quality PDF Files
        </p>

        <label for="quality">
            Compression Quality:
        </label>

        <select id="quality">
            <option value="1">High Quality</option>
            <option value="0.7" selected>Medium Quality</option>
            <option value="0.5">Low Size</option>
        </select>

        <!-- Drag & Drop Area -->
        <div id="dropArea">
            <h3>📂 Drag & Drop Images Here</h3>
            <p>or click below to choose files</p>
        </div>

        <!-- Upload Button -->
        <label for="fileInput" class="upload-label">
            Choose Images
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
            accept="image/*">

        <!-- Preview Images -->
        <div id="preview"></div>

        <!-- Convert Button -->
        <button onclick="generatePDF()">
            Convert to PDF
        </button>

    </main>

    <footer>
        <p>© 2026 RizzPDF. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
